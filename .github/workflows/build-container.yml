name: Build Castopod container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ivor-ncut/castopod-podcast-publisher-skill:4.3.2-api
      - name: Make container public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH
          /users/Ivor-NCUT/packages/container/castopod-podcast-publisher-skill
          -f visibility=public
